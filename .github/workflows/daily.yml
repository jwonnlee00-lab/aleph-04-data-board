name: Collect real daily observation
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-observation
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run collect
        id: collect
        continue-on-error: true
      - name: Preserve observation or failure status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/observations.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record actual KST daily observation'
            git push
          fi
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
